name: Build and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --release
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: bot-binary
        path: target/release/AI-BOT-Helper-MC
